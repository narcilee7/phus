# ─── Provider profiles ────────────────────────────────────────
# Multiple named profiles for different models / gateways.
# Switch via PHUS_PROFILE env var, `--profile` flag, or `/profiles <name>` in TUI.
#
# Each profile:
#   model        — <provider>/<modelId> as registered in pi-mono (required)
#   baseUrl      — override provider's default URL (Volcano Ark, Azure, vLLM)
#   modelId      — override the id sent on the wire (Volcano Ark ep-xxx IDs)
#   headers      — extra HTTP headers (rarely needed)
#   apiKeyEnv    — env var name to read API key from (auto-detected by default)
#   thinkingLevel — off | minimal | low | medium | high | xhigh
#   maxSteps     — max tool-use loop iterations (default: 50)
#   description  — shown in `phus profiles` output
#
providers:
  defaultProfile: smart

  profiles:
    # Default: Anthropic Claude direct
    smart:
      model: anthropic/claude-sonnet-4-20250514
      thinkingLevel: medium
      description: default — balanced quality + speed

    # Cheap + fast for routine tasks
    fast:
      model: openai/gpt-4o-mini
      thinkingLevel: low
      description: cheap OpenAI for routine work

    # Volcano Ark DeepSeek via OpenAI-compatible gateway
    volcano:
      model: deepseek/deepseek-v3-250324
      baseUrl: https://ark.cn-beijing.volces.com/api/v3
      modelId: deepseek-v3-250324        # or your ep-xxxxxxxx endpoint id
      apiKeyEnv: VOLCANO_API_KEY
      thinkingLevel: medium
      description: Volcano Ark (火山方舟) DeepSeek-V3

    # OpenRouter proxy
    openrouter:
      model: openrouter/anthropic/claude-3.5-sonnet
      apiKeyEnv: OPENROUTER_API_KEY
      thinkingLevel: medium
      description: OpenRouter proxy (any model)

    # Self-hosted vLLM
    vllm:
      model: openai/custom-model
      baseUrl: https://your-vllm.internal/v1
      apiKeyEnv: VLLM_API_KEY
      description: self-hosted vLLM endpoint

    # LiteLLM proxy — recommended for production (Phase C)
    # LiteLLM handles fallback chains, cost tracking, rate limits, observability.
    # Set baseUrl to your LiteLLM instance (default: localhost:4000).
    # The "model" must match a model_name in LiteLLM's config.
    litellm:
      model: openai/gpt-4o
      baseUrl: http://localhost:4000/v1
      apiKeyEnv: LITELLM_MASTER_KEY
      thinkingLevel: medium
      description: "via LiteLLM proxy (auto-fallback + cost tracking)"


# ─── Provider mesh (Phase C — runtime, no proxy) ──────────────────
# A profile can declare MULTIPLE endpoints. Phus builds a runtime mesh:
#   - failover (default): try in priority order
#   - weighted: round-robin by weight
#   - cost-first: pick cheapest healthy endpoint
#   - latency-first: pick lowest-p95-latency endpoint
# Each endpoint has its own circuit breaker + retry.
#
# Use this INSTEAD OF LiteLLM — same resilience, zero extra ops.
providers:
  profiles:
    smart-mesh:
      meshStrategy: failover
      thinkingLevel: medium
      description: "Sonnet primary, GPT-4o fallback, Volcano Ark emergency"
      mesh:
        - name: claude-sonnet
          provider: anthropic
          modelId: claude-sonnet-4-20250514
          priority: 0
          costPerMillion: { input: 3, output: 15 }
          tags: [premium, west]
        - name: gpt-4o
          provider: openai
          modelId: gpt-4o
          priority: 1
          costPerMillion: { input: 2.5, output: 10 }
          tags: [premium, west]
        - name: deepseek-v4-pro
          provider: openai
          modelId: deepseek-v4-pro-260425
          baseUrl: https://ark.cn-beijing.volces.com/api/v3
          apiKeyEnv: DEEPSEEK_API_KEY
          priority: 2
          costPerMillion: { input: 0.27, output: 1.1 }
          tags: [cheap, china]

    cheap-mesh:
      meshStrategy: cost-first
      description: "always pick cheapest healthy endpoint"
      mesh:
        - name: gpt-4o-mini
          provider: openai
          modelId: gpt-4o-mini
          costPerMillion: { input: 0.15, output: 0.6 }
        - name: claude-haiku
          provider: anthropic
          modelId: claude-3-5-haiku-20241022
          costPerMillion: { input: 0.8, output: 4 }
        - name: deepseek-v3
          provider: openai
          modelId: deepseek-v3-250324
          baseUrl: https://ark.cn-beijing.volces.com/api/v3
          apiKeyEnv: DEEPSEEK_API_KEY
          costPerMillion: { input: 0.27, output: 1.1 }


# ─── Plugins ───────────────────────────────────────────────────
# Loaded in order. Last entry's `config` is passed to the plugin's
# register(ctx) as ctx.config.
plugins:
  - name: my-plugin
    path: ./plugins/my-plugin.ts
    config:
      debug: true


# ─── Schedules (B.3) ───────────────────────────────────────────
# Cron-style hooks that fire on a schedule. Only runs in gateway mode.
# 5-field standard cron: "minute hour day-of-month month day-of-week"
#
# Fired hook receives HookContext with extras = {
#   schedule: <name>, cron: <expr>, payload: <object>, firedAt: <ms>
# }
schedules:
  # Top of every hour — example: refresh context, prune checkpoints
  - name: hourly-checkin
    cron: "0 * * * *"
    hookName: system_prompt
    description: hourly context refresh

  # 3 AM daily — example: auto-compact old sessions
  - name: daily-compact
    cron: "0 3 * * *"
    hookName: save_state
    description: daily compaction hook

  # Disabled by default — opt in via ,schedule.enable heartbeat-tick
  - name: heartbeat-tick
    cron: "*/15 * * * *"
    hookName: provide_steering_inbox
    enabled: false
    description: inject "still alive?" nudge every 15 min
