name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Stage-5 of the monorepo split: only @phus/cli is published in v1
      # (proposal §6.3). @phus/runtime, @phus/core, @phus/tui stay
      # private and are consumed only via the workspace.
      - name: Publish @phus/cli to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @phus/cli publish \
            --no-git-checks \
            --access public \
            --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Pack distribution archive
        run: |
          mkdir -p release
          # The bin lives under apps/cli/dist/ after Stage 2. The installer
          # (scripts/install.sh) extracts `apps/cli/dist` and hoists
          # `apps/cli/{package.json,pnpm-lock.yaml}` into $PHUS_HOME, then
          # runs `pnpm install --frozen-lockfile --prod` against that root.
          # The previous layout packed the lockfile at the archive root
          # where the installer did not look, leaving consumers with a
          # bin that crashed on first run with ERR_MODULE_NOT_FOUND.
          cp pnpm-lock.yaml apps/cli/pnpm-lock.yaml
          tar -czf "release/phus-${{ steps.dist-tag.outputs.version }}.tar.gz" \
            apps/cli/dist \
            apps/cli/package.json \
            apps/cli/pnpm-lock.yaml \
            README.md LICENSE \
            phus.config.example.yaml scripts/install.sh scripts/install.ps1 \
            scripts/rename-cli-bin.mjs \
            scripts/fix-extensions.mjs
          rm -f apps/cli/pnpm-lock.yaml
          cp "release/phus-${{ steps.dist-tag.outputs.version }}.tar.gz" "release/phus-latest.tar.gz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "Phus ${{ steps.dist-tag.outputs.version }}" \
            "release/phus-${{ steps.dist-tag.outputs.version }}.tar.gz" \
            "release/phus-latest.tar.gz"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=alpha,enable=${{ contains(github.ref_name, '-alpha') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
