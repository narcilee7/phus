name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:        # required so .github/workflows/release.yml can `uses: ./ci.yml`
  workflow_dispatch:

# Force Node 20 on runners where it has been deprecated in favor of Node 24.
# The .nvmrc pins 20; without this env, the runner silently substitutes 24
# which trips the deep-import `exports` resolution (Node 22+ no longer
# matches file extensions in wildcard patterns like `./types/*`). The
# exports field was also widened (see packages/*/package.json) to handle
# both Node 20 and 22+; this env is a belt-and-suspenders for now.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the workspace before test: the runtime tests deep-import
      # `@phus/core/dist/...` etc. via the package exports field, so
      # every published package needs its `dist/` populated. A clean
      # `pnpm install` symlinks the workspace packages but does not
      # invoke their build scripts; this step fills in the dist tree
      # so vitest can resolve the cross-package imports.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Test
        run: pnpm test

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node }}
          path: |
            apps/cli/dist
            packages/runtime/dist
          if-no-files-found: error
