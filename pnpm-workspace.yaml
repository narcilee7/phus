packages:
  - "packages/*"
  - "apps/*"
  # apps/gui (Electron, Node ≥22.12) rejoins this workspace in Stage 4.
  # Until then only apps/cli lives here; it builds with the same Node 20
  # floor as packages/* so no version override is needed.

# TypeScript 7 is intentional; tsdown/rolldown-plugin-dts still declare a
# ^5 peer, so we relax peer-dependency enforcement workspace-wide.
strictPeerDependencies: false